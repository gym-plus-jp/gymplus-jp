name: Keep Supabase Alive

# Supabase Free プランは 7日間アクセスなしで自動 Pause される。
# 週1回、軽量な SELECT を投げてプロジェクトを Active に保つ。
#
# anon key は publishable（クライアント側 config.js に既に公開埋め込み済）なので
# Secrets 登録不要。settings テーブルは初期データが必ず入っている読み取り専用の軽量テーブル。

on:
  schedule:
    - cron: '0 3 * * 1'   # 毎週月曜 03:00 UTC (JST 12:00)
  workflow_dispatch:      # 手動実行も可

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (Gym plus - Jumpolin クーポン)
        env:
          SUPABASE_URL: https://agftmrnrmhrfhwpdhrxs.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFnZnRtcm5ybWhyZmh3cGRocnhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4NTMxOTAsImV4cCI6MjA5ODQyOTE5MH0.dwywvV40cBVFtMCUEdM3_qWdcqobUrq8TZ2k7WraVFo
        run: |
          set -e
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            "$SUPABASE_URL/rest/v1/settings?select=key&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep HTTP_STATUS | cut -d: -f2)
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "206" ]; then
            echo "::error::Ping failed with HTTP $STATUS"
            exit 1
          fi
          echo "✅ Supabase is alive (HTTP $STATUS)"
